# Base theme (Harbour Sunrise, the light mode; Hanken Grotesk). The Dark mode switch in the sidebar
# swaps in Pastel Night Shade with CSS (cbl/ui/styles.py). Streamlit reads this
# file automatically, locally and on Streamlit Cloud.

[theme]
base = "light"
primaryColor = "#1C4A5E"
backgroundColor = "#DCE3E2"
secondaryBackgroundColor = "#E9EEEC"
textColor = "#1F2F37"
linkColor = "#1C4A5E"
redColor = "#B8482A"
blueColor = "#1C4A5E"
font = "'Hanken Grotesk':https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@200;300;400;500;600;700&display=swap"
headingFont = "'Hanken Grotesk':https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@200;300;400;500;600;700&display=swap"
headingFontWeights = 300
baseRadius = "2px"
buttonRadius = "2px"
borderColor = "#A9B9BB"
showWidgetBorder = true
showSidebarBorder = true
dataframeBorderColor = "#BCC9CA"
dataframeHeaderBackgroundColor = "#E9EEEC"

[theme.sidebar]
backgroundColor = "#CDD8D8"
secondaryBackgroundColor = "#DCE3E2"

[client]
toolbarMode = "minimal"

[server]
headless = true
enableStaticServing = true
maxUploadSize = 10   # MB; scoreboard screenshots are about 0.5 MB

[runner]
magicEnabled = false   # never print stray values on the page